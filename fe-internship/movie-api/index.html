<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Search App</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>🎬 Movie Search</h1>
            <p>Search for your favorite movies</p>
        </header>


        <!-- Search -->

        <form id="search-form" class="search-form">

            <input
                type="text"
                id="search-input"
                placeholder="Search for a movie..."
                autocomplete="off"
                required
            >

            <button type="submit">
                Search
            </button>

        </form>


        <!-- Status -->

        <p id="loading" class="loading">
            Loading...
        </p>

        <p id="error-message" class="error"></p>


        <!-- Movies -->

        <section id="movies" class="movies"></section>


        <!-- No results -->

        <p id="no-results" class="no-results">
            No movies found.
        </p>

    </main>


    <script type="module" src="./js/app.js"></script>

</body>

</html>
